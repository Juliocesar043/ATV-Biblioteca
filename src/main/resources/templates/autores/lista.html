<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Autores</title>
</head>
<body>
<h1>Autores</h1>
<a th:href="@{/autores/novo}">Cadastrar autor</a>
<a th:href="@{/livros/listar}">Ver livros</a>

<p th:if="${#lists.isEmpty(autores)}">Nenhum autor cadastrado.</p>
<table th:unless="${#lists.isEmpty(autores)}">
    <thead>
    <tr>
        <th>Nome</th>
        <th>Nacionalidade</th>
        <th>Ação</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="autor : ${autores}">
        <td th:text="${autor.nome}">Nome</td>
        <td th:text="${autor.nacionalidade}">Nacionalidade</td>
        <td><a th:href="@{/autores/excluir/{id}(id=${autor.id})}">Excluir</a></td>
    </tr>
    </tbody>
</table>
</body>
</html>
