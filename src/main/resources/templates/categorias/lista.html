<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorias</title>
</head>
<body>
<h1>Categorias</h1>
<a th:href="@{/categorias/novo}">Cadastrar categoria</a>
<a th:href="@{/livros/listar}">Ver livros</a>
<a th:href="@{/autores/listar}">Ver autores</a>

<p th:if="${#lists.isEmpty(categorias)}">Nenhuma categoria cadastrada.</p>
<table th:unless="${#lists.isEmpty(categorias)}">
    <thead>
    <tr>
        <th>Nome</th>
        <th>Ação</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="categoria : ${categorias}">
        <td th:text="${categoria.nome}">Categoria</td>
        <td><a th:href="@{/categorias/excluir/{id}(id=${categoria.id})}">Excluir</a></td>
    </tr>
    </tbody>
</table>
</body>
</html>
